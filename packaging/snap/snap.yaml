name: pkgdeck
version: 'VERSION'
summary: Manage software from one fast GUI and CLI
description: |
  Search, install, remove, and update software across native Linux package
  managers, Flatpak, Snap, AppImage, firmware, and developer package sources.
base: core24
grade: stable
confinement: classic
architectures: [ARCHITECTURE]
apps:
  pkgdeck:
    command: AppRun
    plugs: [home, removable-media, network]
  pkd:
    command: usr/bin/pkd
