app-id: io.github.astrovm.PkgDeck
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: pkgdeck
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: pkgdeck
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/pkgdeck/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --offline --release --locked -p pkgdeck -p pkd
      - install -Dm755 target/release/pkgdeck /app/bin/pkgdeck
      - install -Dm755 target/release/pkd /app/bin/pkd
      - install -Dm644 assets/io.github.astrovm.PkgDeck.desktop /app/share/applications/io.github.astrovm.PkgDeck.desktop
      - install -Dm644 assets/io.github.astrovm.PkgDeck.metainfo.xml /app/share/metainfo/io.github.astrovm.PkgDeck.metainfo.xml
      - install -Dm644 assets/io.github.astrovm.PkgDeck.svg /app/share/icons/hicolor/scalable/apps/io.github.astrovm.PkgDeck.svg
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
