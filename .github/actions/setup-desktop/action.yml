name: Set up desktop dependencies
description: Install the Ubuntu toolchain and display libraries shared by desktop CI jobs.
inputs:
  packaging:
    description: Include package-building and lifecycle tools.
    default: 'false'
  coverage:
    description: Install the pinned coverage tool.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install desktop dependencies
      shell: bash
      env:
        PACKAGING: ${{ inputs.packaging }}
      run: |
        packages=(
          build-essential libapt-pkg-dev jq libarchive-tools cmake ninja-build lld pkg-config
          libgl1 libegl1 libgl1-mesa-dri libxkbcommon0 libxkbcommon-x11-0
          libx11-6 libx11-xcb1 libxcursor1 libxrandr2 libxi6 libwayland-client0
          libwayland-cursor0 libwayland-egl1 libdbus-1-3 xvfb xdotool fonts-dejavu-core
        )
        if [[ "$PACKAGING" == true ]]; then
          packages+=(snapd squashfs-tools desktop-file-utils podman)
        fi
        sudo scripts/ci/apt-mirrors.sh
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends "${packages[@]}"
        rustup show
    - name: Install coverage tool
      if: inputs.coverage == 'true'
      shell: bash
      run: scripts/setup-dev.sh
