name: CI
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal:
    name: Qt-free terminal (${{ matrix.runner }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libapt-pkg-dev jq
      - run: rustup show
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: terminal-rust-cache
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-v2-${{ matrix.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
      - run: scripts/verify.sh fast
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && steps.terminal-rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.terminal-rust-cache.outputs.cache-primary-key }}

  host-vm:
    name: APT and Homebrew lifecycles in disposable VM (x86_64)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install VM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vm-cache
        with:
          path: build/host-vm
          key: ubuntu-host-vm-26.04-20260823-${{ hashFiles('scripts/vm/prepare.sh') }}
      - name: Verify native lifecycle and authorization
        run: scripts/verify.sh vm
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && steps.vm-cache.outputs.cache-hit != 'true'
        with:
          path: build/host-vm
          key: ${{ steps.vm-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: host-vm-logs
          path: |
            build/host-vm/logs
            build/verification

  containers:
    name: Rootless Podman (${{ matrix.runner }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      PKGDECK_STAGE_TIMEOUT: 35m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rootless container tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman info
      - name: Verify development image and native package lifecycles
        run: |
          scripts/verify.sh full --engine podman
          scripts/verify.sh containers --engine podman
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: container-verification-${{ matrix.runner }}
          path: build/verification

  native-backends:
    name: Real native backends (${{ matrix.backend }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [dnf, pacman, zypper]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rootless container tooling
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build CLI
        run: cargo build --locked -p pkd
      - name: Exercise actual package manager
        run: scripts/tests/native-manager.sh ${{ matrix.backend }} "$PWD/target/debug/pkd"

  snap-backend:
    name: Real Snap backend
    timeout-minutes: 25
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and start Snapd
        run: |
          sudo apt-get update
          sudo apt-get install -y snapd
          sudo systemctl enable --now snapd.socket
          sudo snap wait system seed.loaded
      - name: Build CLI
        run: cargo build --locked -p pkd && install -m 755 target/debug/pkd /tmp/pkgdeck-pkd
      - name: Exercise actual Snap lifecycle
        run: |
          sudo useradd -m pkgdeck-test
          echo 'pkgdeck-test ALL=(root) NOPASSWD: /usr/bin/snap' | sudo tee /etc/sudoers.d/pkgdeck-snap
          run() { sudo -u pkgdeck-test /tmp/pkgdeck-pkd --json --yes --auth sudo --from snap "$@"; }
          success() { run "$@" | grep -q '"exit_code":0'; }
          success sources
          success search hello-world
          success info hello-world
          success update
          success install hello-world
          snap list hello-world
          success remove hello-world
          ! snap list hello-world

  dev-backends:
    name: Real dev backends (${{ matrix.backend }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [cargo, npm, pnpm, bun]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build CLI
        run: cargo build --locked -p pkd
      - name: Exercise actual development manager
        run: scripts/tests/dev-manager.sh ${{ matrix.backend }} "$PWD/target/debug/pkd"

  desktop:
    name: GUI, coverage and packages (${{ matrix.arch }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86_64
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_dir: gcc_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            qt_dir: gcc_arm64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libapt-pkg-dev jq libarchive-tools cmake ninja-build lld pkg-config qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev qt6-shadertools-dev qt6-wayland libkirigami-dev extra-cmake-modules libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libvulkan-dev libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 libxcb-image0 libxcb-render-util0 libxcb-randr0 libxcb-sync1 libxcb-xfixes0 libxcb-glx0 libdbus-1-3 libfontconfig1 libfreetype6 libopengl0 libpulse0 libgssapi-krb5-2 libnss3 libasound2t64 libxcomposite1 libxdamage1 libxtst6 libwayland-cursor0 libwayland-egl1 flatpak flatpak-builder snapd squashfs-tools zsync desktop-file-utils podman xvfb xdotool fonts-dejavu-core
          rustup show
      - name: Prepare pinned development tools
        run: scripts/setup-dev.sh
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: rust-cache
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-v2-${{ matrix.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
      - name: Verify workspace, coverage, and release builds
        run: scripts/verify.sh full
      - name: Build and stage both executables
        run: |
          source scripts/dev-env.sh
          cargo build --locked -p pkgdeck-tools
          scripts/bundle.sh
          test -x build/AppDir/usr/lib/pkgdeck/appimageupdatetool.AppImage
          desktop-file-validate assets/io.github.astrovm.PkgDeck.desktop
          unset LD_LIBRARY_PATH QML_IMPORT_PATH
          scripts/xtask.sh gui build/AppDir/AppRun
          scripts/xtask.sh terminal build/AppDir/AppRun --cli
          build/AppDir/AppRun --cli --version
          build/AppDir/AppRun --cli doctor
      - name: Verify staged GUI native lifecycles in isolation
        run: PKGDECK_FRONTEND=gui PKGDECK_BINARY_DIR="$PWD/build/AppDir/usr/bin" scripts/container.sh lifecycle
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Build and smoke-test AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/build/appimagetool
        run: |
          curl -fL --retry 3 'https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage' -o "$APPIMAGETOOL"
          chmod +x "$APPIMAGETOOL"
          scripts/package.sh appimage
          'build/artifacts/PkgDeck-${{ matrix.arch }}.AppImage' --appimage-extract 'usr/lib/pkgdeck/appimageupdatetool.AppImage' >/dev/null
          test -x 'squashfs-root/usr/lib/pkgdeck/appimageupdatetool.AppImage'
          rm -rf squashfs-root
          unset LD_LIBRARY_PATH QML_IMPORT_PATH
          export APPIMAGE_EXTRACT_AND_RUN=1
          scripts/xtask.sh gui 'build/artifacts/PkgDeck-${{ matrix.arch }}.AppImage'
          scripts/xtask.sh terminal 'build/artifacts/PkgDeck-${{ matrix.arch }}.AppImage' --cli
          'build/artifacts/PkgDeck-${{ matrix.arch }}.AppImage' --cli doctor
          appimage=$PWD/build/artifacts/PkgDeck-${{ matrix.arch }}.AppImage
          data=$PWD/build/appimage-backend-data
          XDG_DATA_HOME="$data" "$appimage" --cli --json --yes --from appimage search "$appimage" | jq -e '.exit_code == 0'
          XDG_DATA_HOME="$data" "$appimage" --cli --json --yes --from appimage install "$appimage" | jq -e '.exit_code == 0'
          imported=$(XDG_DATA_HOME="$data" "$appimage" --cli --json --from appimage list | jq -r '.data.packages[0].id.name')
          XDG_DATA_HOME="$data" "$appimage" --cli --json --yes --from appimage remove "$imported" | jq -e '.exit_code == 0'
      - name: Build and smoke-test Flatpak
        run: |
          sudo flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system -y --noninteractive flathub org.kde.Platform//6.11 org.kde.Sdk//6.11 org.freedesktop.Sdk.Extension.rust-stable//25.08
          scripts/package.sh flatpak
          sudo flatpak install --system -y --noninteractive 'build/artifacts/PkgDeck-${{ matrix.arch }}.flatpak'
          scripts/xtask.sh gui flatpak run --env=QT_QPA_PLATFORM=offscreen --env=QT_QUICK_BACKEND=software io.github.astrovm.PkgDeck
          scripts/xtask.sh terminal flatpak run --command=pkd io.github.astrovm.PkgDeck
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub org.kde.kcalc
          run_flatpak() { build/AppDir/usr/bin/pkd --json --yes --auth sudo --from flatpak "$@"; }
          check() { local file=$1 filter=$2; shift 2; "$@" | tee "$file" | jq -e "$filter" || { echo "--- $file ---"; cat "$file"; exit 1; }; }
          run_flatpak list | tee /tmp/pkd-flatpak-list.json | jq -e 'any(.data.packages[]; .id.name == "org.kde.kcalc")'
          flatpak --user search --columns=name,description,application,version,branch,remotes org.kde.kcalc | tee /tmp/pkd-flatpak-search-user.txt
          flatpak --system search --columns=name,description,application,version,branch,remotes org.kde.kcalc | tee /tmp/pkd-flatpak-search-system.txt || true
          check /tmp/pkd-flatpak-info.json '.exit_code == 0' run_flatpak info org.kde.kcalc
          check /tmp/pkd-flatpak-update.json '.exit_code == 0' run_flatpak update
          check /tmp/pkd-flatpak-remove.json '.exit_code == 0' run_flatpak remove org.kde.kcalc
          ! flatpak --user list --app | grep -q org.kde.kcalc
      - name: Build and inspect Snap
        run: |
          scripts/package.sh snap
          unsquashfs -d build/snap-check build/artifacts/*.snap
          test -x build/snap-check/usr/bin/pkgdeck
          test -x build/snap-check/usr/bin/pkd
          unset LD_LIBRARY_PATH QML_IMPORT_PATH
          scripts/xtask.sh gui build/snap-check/AppRun
          scripts/xtask.sh terminal build/snap-check/usr/bin/pkd
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.arch }}
          path: build/artifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.arch }}
          path: coverage/lcov.info
          if-no-files-found: error
