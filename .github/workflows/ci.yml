name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      homebrew_only:
        description: Validate a published Homebrew formula on Linux and macOS only
        type: boolean
        default: false

permissions:
  contents: read

# A newer push, to a pull request or main, replaces the run for the older
# commit. Release tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # PR and ordinary manual runs validate the full matrix. Formula updates use
  # a targeted manual run; tags reuse the PR run after release-gate verifies it.
  # Pushes to main rerun only the jobs that save caches, so every pull request
  # starts from main's build outputs instead of compiling from scratch.
  test-linux:
    # One job per architecture runs the whole Linux suite once: the shared
    # checks, lint, every workspace test (measured for coverage on x86_64),
    # and the real sudo/polkit authorization tests.
    name: Test / Linux (${{ matrix.arch }})
    if: (github.event_name != 'push' || github.ref == 'refs/heads/main') && !inputs.homebrew_only
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04, arch: x86_64, suite: 'checks,lint,coverage', coverage: 'true' }
          - { runner: ubuntu-26.04-arm, arch: aarch64, suite: 'checks,tests', coverage: 'false' }
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install authorization test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libapt-pkg-dev jq pkexec polkitd
      - name: Cache Rust build outputs
        uses: ./.github/actions/rust-cache
        with:
          arch: ${{ matrix.arch }}
          scope: linux
      - name: Set up desktop dependencies
        uses: ./.github/actions/setup-desktop
        with:
          coverage: ${{ matrix.coverage }}
      - name: Run checks, lint and workspace tests
        # The 100% gate applies to all platforms together (Coverage / Combined).
        run: scripts/verify.sh full --only ${{ matrix.suite }}
      - name: Upload coverage report
        if: matrix.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux-${{ matrix.arch }}
          path: coverage/lcov.info
          if-no-files-found: error
      - name: Build authorization probes
        run: |
          cargo build --locked -p pkgdeck-core --example apt-probe
          cargo build --locked -p pkgdeck-core --bin pkgdeck-host-runner
          cargo build --locked -p pkd -p pkgdeck-tools
      - name: Run host authorization tests
        run: |
          sudo env \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            RUNNER_OS="$RUNNER_OS" \
            RUNNER_ARCH="$RUNNER_ARCH" \
            scripts/tests/host-authorization.sh

  test-macos:
    name: Test / macOS native (${{ matrix.arch }})
    if: (github.event_name != 'push' || github.ref == 'refs/heads/main') && !inputs.homebrew_only
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: aarch64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust and JSON assertions
        run: |
          rustup show
          brew install jq coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Cache Rust build outputs
        uses: ./.github/actions/rust-cache
        with:
          arch: ${{ matrix.arch }}
          scope: macos-native
      - name: Install coverage tool
        if: matrix.arch == 'aarch64'
        run: command -v cargo-llvm-cov >/dev/null || cargo install cargo-llvm-cov --version 0.9.1 --locked
      # Apple Silicon measures coverage while testing: macOS-only code runs
      # only here, and Coverage / Combined adds it to the Linux report.
      - name: Run all core and CLI tests
        run: |
          if [[ ${{ matrix.arch }} == aarch64 ]]; then
            mkdir -p coverage
            cargo llvm-cov -p pkgdeck-core -p pkd --locked --no-fail-fast --lcov --output-path coverage/lcov.info
          else
            cargo test --locked -p pkgdeck-core -p pkd --no-fail-fast
          fi
      - name: Upload coverage report
        if: matrix.arch == 'aarch64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-macos-aarch64
          path: coverage/lcov.info
          if-no-files-found: error
      - name: Build CLI
        run: cargo build --locked -p pkd
      - name: Test real bundles and Homebrew cask lifecycle
        run: bash scripts/tests/macos-inventory.sh
      - name: Test adopting an existing app into Homebrew
        run: bash scripts/tests/macos-adoption.sh
      - name: Upload native inventory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-native-${{ matrix.arch }}
          path: build/macos-native

  test-podman:
    name: Test / Podman (${{ matrix.arch }})
    if: (github.event_name != 'push' || github.ref == 'refs/heads/main') && !inputs.homebrew_only
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      PKGDECK_STAGE_TIMEOUT: 30m
      PKGDECK_CONTAINER_CACHE: ${{ github.workspace }}/build/container-cache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Podman dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman info
      - name: Cache container build outputs
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/container-cache
            !build/container-cache/target/**/incremental
          key: podman-v1-${{ matrix.arch }}-${{ hashFiles('containers/development.Containerfile', 'scripts/setup-dev.sh', 'scripts/dev-env.sh', 'Cargo.toml', 'crates/*/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            podman-v1-${{ matrix.arch }}-${{ hashFiles('containers/development.Containerfile', 'scripts/setup-dev.sh', 'scripts/dev-env.sh', 'Cargo.toml', 'crates/*/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}-
            podman-v1-${{ matrix.arch }}-
      - name: Restore container build outputs
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/container-cache
            !build/container-cache/target/**/incremental
          key: podman-v1-${{ matrix.arch }}-${{ hashFiles('containers/development.Containerfile', 'scripts/setup-dev.sh', 'scripts/dev-env.sh', 'Cargo.toml', 'crates/*/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            podman-v1-${{ matrix.arch }}-${{ hashFiles('containers/development.Containerfile', 'scripts/setup-dev.sh', 'scripts/dev-env.sh', 'Cargo.toml', 'crates/*/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}-
            podman-v1-${{ matrix.arch }}-
      # Building the CLI in the development container checks its recipe.
      # The workspace tests already run natively on both architectures
      # (coverage on x86_64, test-workspace on aarch64) with the same
      # Ubuntu 26.04 Qt packages, so they are not repeated here.
      - name: Run container CLI lifecycle tests
        run: scripts/verify.sh containers --engine podman
      - name: Upload Podman logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-podman-${{ matrix.arch }}
          path: build/verification

  test-backends:
    # One job per platform and group: separate per-backend jobs spent most of
    # their time queued for runners (5 concurrent macOS jobs per account) and
    # setting up. scripts/tests/backends.sh still reports each backend.
    name: Test / Backends / ${{ matrix.group }} (${{ matrix.platform }})
    if: github.event_name != 'push' && !inputs.homebrew_only
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: native, platform: linux-x86_64, runner: ubuntu-26.04, arch: x86_64 }
          - { group: native, platform: linux-aarch64, runner: ubuntu-26.04-arm, arch: aarch64 }
          - { group: dev, platform: linux-x86_64, runner: ubuntu-26.04, arch: x86_64 }
          - { group: dev, platform: linux-aarch64, runner: ubuntu-26.04-arm, arch: aarch64 }
          - { group: dev, platform: macos-x86_64, runner: macos-26-intel, arch: x86_64 }
          - { group: dev, platform: macos-aarch64, runner: macos-26, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Podman and Snap
        if: matrix.group == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman snapd
          sudo systemctl enable --now snapd.socket
          sudo snap wait system seed.loaded
      - name: Restore terminal build outputs
        uses: ./.github/actions/rust-cache
        with:
          arch: ${{ matrix.arch }}
          scope: ${{ startsWith(matrix.platform, 'linux-') && 'linux' || 'macos-native' }}
          save: 'false'
      - name: Build CLI
        run: cargo build --locked -p pkd
      # Alpine uses musl and Void an older glibc, so their tests get a static CLI.
      - name: Build static CLI for musl distributions
        if: matrix.group == 'native'
        run: |
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.arch }}-unknown-linux-musl
          cargo build --locked -p pkd --target ${{ matrix.arch }}-unknown-linux-musl
      - name: Run backend lifecycle tests
        run: |
          scripts/tests/backends.sh ${{ matrix.group }} "$PWD/target/debug/pkd" \
            "$PWD/target/${{ matrix.arch }}-unknown-linux-musl/debug/pkd"
      - name: Upload MacPorts logs
        if: always() && startsWith(matrix.platform, 'macos-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macports-${{ matrix.platform }}
          path: build/macports
          if-no-files-found: ignore

  coverage-combined:
    # One number for all the code: a line counts once and is covered when a
    # test ran it on any platform.
    name: Coverage / Combined
    needs: [test-linux, test-macos]
    if: (github.event_name != 'push' || github.ref == 'refs/heads/main') && !inputs.homebrew_only
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage
      - name: Require 100% of all lines
        run: |
          bash scripts/coverage-merge.sh --fail-under 100 --summary "$GITHUB_STEP_SUMMARY" \
            "Linux (workspace)=coverage/coverage-linux-x86_64/lcov.info" \
            "macOS (core and CLI)=coverage/coverage-macos-aarch64/lcov.info"

  package-macos:
    name: Package / macOS app (${{ matrix.arch }})
    if: '!inputs.homebrew_only'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: aarch64
          - runner: macos-26-intel
            arch: x86_64
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        id: deps
        run: |
          brew install cmake ninja librsvg qtbase qtdeclarative qtimageformats qtshadertools qtsvg qttools \
            coreutils jq pkgconf openssl@3
          rustup show
          # Kirigami uses Qt private API, so its build is only reusable with the same Qt.
          echo "qt=$(brew list --versions qtbase qtdeclarative | tr ' \n' '--')" >> "$GITHUB_OUTPUT"
          # Only the Kirigami recipe (version, checksums, build flags) decides
          # whether its 6-minute build can be reused, not the rest of the script.
          recipe=$(grep -E 'kf_version=|fetch |kde_build |-D[A-Z]' scripts/bundle-macos.sh | shasum -a 256 | cut -c1-16)
          echo "kirigami=$recipe" >> "$GITHUB_OUTPUT"
      - name: Cache Rust build outputs
        uses: ./.github/actions/rust-cache
        with:
          arch: ${{ matrix.arch }}
          scope: macos-app
      - name: Cache Kirigami build
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/macos/kde
          key: kirigami-v2-${{ matrix.arch }}-${{ steps.deps.outputs.qt }}-${{ steps.deps.outputs.kirigami }}
      - name: Restore Kirigami build
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/macos/kde
          key: kirigami-v2-${{ matrix.arch }}-${{ steps.deps.outputs.qt }}-${{ steps.deps.outputs.kirigami }}
      - name: Build app bundle
        run: scripts/bundle-macos.sh
      - name: Check bundle requirements
        run: |
          minimum=$(plutil -extract LSMinimumSystemVersion raw build/macos/PkgDeck.app/Contents/Info.plist)
          # The cask declares macOS 26 (Tahoe); the bundle must not need newer.
          [[ ${minimum%%.*} -le 26 ]] || { echo "Bundle needs macOS $minimum" >&2; exit 1; }
          if otool -L build/macos/PkgDeck.app/Contents/MacOS/pkd | grep -qi Qt; then
            echo 'CLI unexpectedly links Qt' >&2
            exit 1
          fi
      - name: Test macOS GUI controllers, QML, startup and media
        run: |
          PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix qtbase)/bin:$(brew --prefix qtdeclarative)/bin:$(brew --prefix qttools)/bin:$(brew --prefix openssl@3)/bin:$PATH"
          QMAKE="$(brew --prefix qtbase)/bin/qmake"
          export PATH QMAKE
          export QML_IMPORT_PATH="$PWD/build/macos/kde/lib/qml"
          export QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software
          # The bundle step already built the release profile; testing it
          # reuses those outputs instead of compiling everything again.
          cargo test --locked --release -p pkgdeck --no-fail-fast -- --test-threads=1
      - name: Upload macOS startup diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-startup-${{ matrix.arch }}
          path: ${{ runner.temp }}/pkgdeck-macos-startup
          if-no-files-found: ignore
      - name: Test Homebrew cask install
        # Installs this job's own package, instead of a separate job waiting
        # for a macOS runner and downloading it again.
        run: bash scripts/tests/homebrew-cask.sh build/artifacts
      - name: Upload app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-macos-${{ matrix.arch }}
          path: build/artifacts/PkgDeck-v*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  package-linux-cli:
    name: Package / Linux CLI (${{ matrix.arch }})
    if: '!inputs.homebrew_only'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install static toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup show
      - name: Cache Rust build outputs
        uses: ./.github/actions/rust-cache
        with:
          arch: ${{ matrix.arch }}
          scope: cli-musl
      - name: Build static CLI
        run: scripts/package-cli.sh
      - name: Test CLI on another libc
        run: |
          unpacked=$(mktemp -d)
          tar -xzf build/artifacts/PkgDeck-v*-linux-${{ matrix.arch }}-cli.tar.gz -C "$unpacked"
          # Alpine uses musl rather than glibc, so this also proves no host libc is needed.
          docker run --rm -v "$unpacked:/cli:ro" alpine:3 sh -euc '
            cd /cli/*
            bin/pkd --version | grep -F pkd
            bin/pkd --help | grep -F Usage:
            test -x libexec/pkgdeck-host-runner
          '
      - name: Upload CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-linux-cli-${{ matrix.arch }}
          path: build/artifacts/PkgDeck-v*-linux-${{ matrix.arch }}-cli.tar.gz
          if-no-files-found: error

  test-homebrew:
    name: Test / Homebrew (${{ matrix.runner }})
    needs: [package-linux-cli]
    # Release formula PRs and homebrew_only runs test the committed recipes
    # against published assets; other runs test this checkout's packages.
    if: >-
      !cancelled() && (github.event_name != 'push' || github.ref == 'refs/heads/main') &&
      (inputs.homebrew_only || needs.package-linux-cli.result == 'success')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The Mac packaging jobs test the cask with the app they built.
        # Published recipes are still checked on every runner.
        runner: ${{ fromJSON((inputs.homebrew_only || startsWith(github.head_ref, 'release/homebrew-')) && '["ubuntu-26.04","ubuntu-26.04-arm","macos-26","macos-26-intel"]' || '["ubuntu-26.04","ubuntu-26.04-arm"]') }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      PUBLISHED: ${{ inputs.homebrew_only || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/homebrew-')) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Homebrew
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            if [[ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]]; then
              # The arm64 image has no Homebrew; use the release pinned for the VM tests.
              sudo mkdir -p /home/linuxbrew/.linuxbrew
              sudo chown -R "$USER" /home/linuxbrew
              git clone --quiet --depth 1 --branch 7.0.6 https://github.com/Homebrew/brew /home/linuxbrew/.linuxbrew/Homebrew
              mkdir -p /home/linuxbrew/.linuxbrew/bin
              ln -s ../Homebrew/bin/brew /home/linuxbrew/.linuxbrew/bin/brew
            fi
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          fi
      - name: Download packages
        if: env.PUBLISHED != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-linux-cli-*
          path: dist
          merge-multiple: true
      - name: Prepare tap
        run: |
          brew tap-new --no-git astrovm/pkgdeck
          # As the install docs say: Homebrew 6+ only loads trusted third-party taps.
          brew trust astrovm/pkgdeck
          tap=$(brew --repository astrovm/pkgdeck)
          if [[ $PUBLISHED == true ]]; then
            mkdir -p "$tap/Casks"
            cp Formula/pkd.rb "$tap/Formula/pkd.rb"
            cp Casks/pkgdeck.rb "$tap/Casks/pkgdeck.rb"
          else
            version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
            (cd dist && shasum -a 256 PkgDeck-v* > SHA256SUMS)
            # The Mac packages are tested in their own jobs.
            PKGDECK_RENDER_PLACEHOLDERS=1 scripts/homebrew-render.sh "$version" dist/SHA256SUMS "file://$PWD/dist" "$tap"
          fi
      - name: Check formula and cask style
        run: |
          brew style astrovm/pkgdeck/pkd
          brew style --cask astrovm/pkgdeck/pkgdeck
      - name: Install and test Linux CLI
        if: runner.os == 'Linux'
        run: |
          brew install astrovm/pkgdeck/pkd
          brew test astrovm/pkgdeck/pkd
          # Rust links musl binaries as static PIE on some architectures.
          if ! file -L "$(brew --prefix astrovm/pkgdeck/pkd)/bin/pkd" | grep -Eq 'statically linked|static-pie linked'; then
            echo 'Homebrew pkd is not static' >&2
            exit 1
          fi
      - name: Install macOS app and CLI
        if: runner.os == 'macOS'
        run: |
          # The unqualified name must reach the cask, not the Linux-only formula.
          brew install astrovm/pkgdeck/pkgdeck
          brew list --cask astrovm/pkgdeck/pkgdeck
          if xattr -p com.apple.quarantine /Applications/PkgDeck.app 2>/dev/null; then
            echo 'Installed app is still quarantined' >&2
            exit 1
          fi
          "$(brew --prefix)/bin/pkd" --version | grep -F pkd
      - name: Test installed macOS Cocoa startup
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: bash scripts/tests/macos-gui.sh "$(brew --prefix)/bin/pkgdeck"
      - name: Uninstall macOS app
        if: runner.os == 'macOS'
        run: |
          brew uninstall --cask astrovm/pkgdeck/pkgdeck
          test ! -e /Applications/PkgDeck.app
          test ! -e "$(brew --prefix)/bin/pkd"
      - name: Upload macOS startup diagnostics
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-startup-${{ matrix.runner }}
          path: ${{ runner.temp }}/pkgdeck-macos-startup
          if-no-files-found: ignore

  package-bundles:
    name: Package / AppImage + Snap (${{ matrix.arch }})
    if: '!inputs.homebrew_only'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Rust build outputs
        uses: ./.github/actions/rust-cache
        with:
          arch: ${{ matrix.arch }}
          scope: release
      - name: Set up desktop dependencies
        uses: ./.github/actions/setup-desktop
        with:
          packaging: 'true'
      - name: Build release binaries
        run: scripts/verify.sh full --only release
      - name: Test staged bundle
        run: |
          source scripts/dev-env.sh
          cargo build --locked -p pkgdeck-tools
          scripts/bundle.sh
          scripts/tests/media-cache.sh "$PWD/build/AppDir/usr"
          test -x build/AppDir/usr/lib/pkgdeck/appimageupdatetool.AppImage
          test -x build/AppDir/usr/libexec/pkgdeck-host-runner
          desktop-file-validate assets/io.github.astrovm.PkgDeck.desktop
          unset LD_LIBRARY_PATH QML_IMPORT_PATH
          scripts/xtask.sh gui build/AppDir/AppRun
          build/AppDir/AppRun --cli </dev/null | grep -F 'Usage: pkd'
          build/AppDir/AppRun --cli --version
          build/AppDir/AppRun --cli doctor
      - name: Run packaged GUI lifecycle tests
        run: PKGDECK_FRONTEND=gui PKGDECK_BINARY_DIR="$PWD/build/AppDir/usr/bin" scripts/container.sh lifecycle
      - name: Build and test AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/build/appimagetool
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          image="build/artifacts/PkgDeck-v${version}-${{ matrix.arch }}.AppImage"
          curl -fL --retry 3 'https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage' -o "$APPIMAGETOOL"
          chmod +x "$APPIMAGETOOL"
          scripts/package.sh appimage
          "$image" --appimage-extract 'usr/lib/pkgdeck/appimageupdatetool.AppImage' >/dev/null
          test -x 'squashfs-root/usr/lib/pkgdeck/appimageupdatetool.AppImage'
          rm -rf squashfs-root
          "$image" --appimage-extract 'usr/libexec/pkgdeck-host-runner' >/dev/null
          test -x 'squashfs-root/usr/libexec/pkgdeck-host-runner'
          rm -rf squashfs-root
          unset LD_LIBRARY_PATH QML_IMPORT_PATH
          export APPIMAGE_EXTRACT_AND_RUN=1
          scripts/xtask.sh gui "$image"
          "$image" --cli </dev/null | grep -F 'Usage: pkd'
          "$image" --cli doctor
          if runner_output=$("$image" --batch-runner 2>&1); then
            echo 'AppImage runner unexpectedly started without authorization' >&2
            exit 1
          fi
          [[ $runner_output == *'host runner requires root'* ]]
          appimage=$PWD/$image
          scripts/tests/host-package.sh direct "$appimage" --cli
          data=$PWD/build/appimage-backend-data
          XDG_DATA_HOME="$data" "$appimage" --cli --json --yes --from appimage search "$appimage" | jq -e '.exit_code == 0'
          XDG_DATA_HOME="$data" "$appimage" --cli --json --yes --from appimage install "$appimage" | jq -e '.exit_code == 0'
          imported=$(XDG_DATA_HOME="$data" "$appimage" --cli --json --from appimage list | jq -r '.data.packages[0].id.name')
          XDG_DATA_HOME="$data" "$appimage" --cli --json --yes --from appimage remove "$imported" | jq -e '.exit_code == 0'
      - name: Build and test Snap
        run: |
          scripts/package.sh snap
          unsquashfs -d build/snap-check build/artifacts/*.snap
          test -x build/snap-check/usr/bin/pkgdeck
          test -x build/snap-check/usr/bin/pkd
          test -x build/snap-check/usr/libexec/pkgdeck-host-runner
          unset LD_LIBRARY_PATH QML_IMPORT_PATH
          scripts/xtask.sh gui build/snap-check/AppRun
          build/snap-check/usr/bin/pkd </dev/null | grep -F 'Usage: pkd'
          sudo systemctl enable --now snapd.socket
          sudo snap wait system seed.loaded
          sudo snap install --dangerous --classic build/artifacts/*.snap
          snap run pkgdeck.pkd --version
          snap run pkgdeck.pkd doctor
          scripts/tests/host-package.sh direct snap run pkgdeck.pkd
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-linux-bundles-${{ matrix.arch }}
          path: build/artifacts/*
          if-no-files-found: error

  package-flatpak:
    name: Package / Flatpak (${{ matrix.arch }})
    if: github.ref != 'refs/heads/main' && !inputs.homebrew_only
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flatpak test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder dbus-daemon elfutils xvfb xdotool jq fonts-dejavu-core
          command -v eu-strip
          rustup show
      - name: Build GUI test helper
        run: cargo build --locked -p pkgdeck-tools
      - name: Build and test Flatpak
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          bundle="build/artifacts/PkgDeck-v${version}-${{ matrix.arch }}.flatpak"
          sudo flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system -y --noninteractive flathub org.kde.Platform//6.11 org.kde.Sdk//6.11 org.freedesktop.Sdk.Extension.rust-stable//25.08
          scripts/package.sh flatpak
          sudo flatpak install --system -y --noninteractive "$bundle"
          scripts/xtask.sh gui flatpak run --env=QT_QPA_PLATFORM=offscreen --env=QT_QUICK_BACKEND=software io.github.astrovm.PkgDeck
          flatpak run --command=pkd io.github.astrovm.PkgDeck </dev/null | grep -F 'Usage: pkd'
          flatpak run --command=sh io.github.astrovm.PkgDeck -c 'test -x /app/libexec/pkgdeck-host-runner'
          scripts/tests/flatpak-package.sh
      - name: Upload Flatpak
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-linux-flatpak-${{ matrix.arch }}
          path: build/artifacts/PkgDeck-v*-${{ matrix.arch }}.flatpak
          if-no-files-found: error

  prune-caches:
    # Main saves each cache under a new key per commit, and the repository's
    # 10 GB limit then evicts the caches pull requests need. Keep only the
    # newest copy of each cache once this run has saved its own.
    name: Prune superseded caches
    needs: [test-linux, test-macos, test-podman, package-macos, package-linux-cli, package-bundles]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete older copies of each cache
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref refs/heads/main --limit 1000 --json id,key,createdAt \
            --jq 'map(. + {prefix: (.key | sub("-[0-9a-f]{40}$"; ""))}) | group_by(.prefix)[] | sort_by(.createdAt) | .[:-1][] | "\(.id) \(.key)"' |
            while read -r id key; do
              echo "Deleting $key"
              gh cache delete "$id"
            done

  release-gate:
    name: Release / Verify reviewed commit
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out tagged source and main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag matches a merged, CI-tested pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo '::error::Release tag must point to a commit on main.'
            exit 1
          fi

          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -r --arg sha "$GITHUB_SHA" \
              '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | first | if . == null then empty else [.number, .head.sha, .head.repo.full_name] | @tsv end')
          if [[ -z "$pr" ]]; then
            echo '::error::Release tag must point to a pull request merge commit on main.'
            exit 1
          fi
          IFS=$'\t' read -r pr_number head_sha head_repo <<< "$pr"
          test -n "$head_sha"
          test -n "$head_repo"

          head_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" --jq '.tree.sha')
          if [[ "$head_tree" != "$(git rev-parse 'HEAD^{tree}')" ]]; then
            echo '::error::Tagged tree differs from the reviewed pull request head.'
            exit 1
          fi

          run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f event=pull_request -f "head_sha=$head_sha" -f per_page=100 |
            jq -r --arg sha "$head_sha" --arg repo "$head_repo" \
              '[.workflow_runs[] | select(.event == "pull_request" and .head_sha == $sha and .head_repository.full_name == $repo and .status == "completed" and .conclusion == "success" and .path == ".github/workflows/ci.yml")] | first | .html_url // empty')
          if [[ -z "$run" ]]; then
            echo "::error::PR #$pr_number has no successful CI run for its merged head commit."
            exit 1
          fi
          echo "Release tag matches PR #$pr_number and successful CI run $run"

  release:
    name: Publish / Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-gate, package-bundles, package-flatpak, package-macos, package-linux-cli]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Verify version and generate update metadata
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          manifest_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          test "$version" = "$manifest_version"
          sudo apt-get update
          sudo apt-get install -y zsync
          for arch in x86_64 aarch64; do
            for suffix in AppImage flatpak snap; do
              test -s "dist/PkgDeck-${GITHUB_REF_NAME}-${arch}.${suffix}"
            done
            test -s "dist/PkgDeck-${GITHUB_REF_NAME}-linux-${arch}-cli.tar.gz"
            test -s "dist/PkgDeck-${GITHUB_REF_NAME}-macos-${arch}.zip"
          done
          for image in dist/*.AppImage; do zsyncmake -u "$(basename "$image")" -o "$image.zsync" "$image"; done
          scripts/flatpak-release-manifest.sh "$GITHUB_REF_NAME" "dist/PkgDeck-${GITHUB_REF_NAME}-flatpak-manifest.yml"
          (cd dist && sha256sum -- PkgDeck-"${GITHUB_REF_NAME}"-* > "PkgDeck-${GITHUB_REF_NAME}-SHA256SUMS")
          for asset in dist/*; do
            [[ $(basename "$asset") == PkgDeck-"${GITHUB_REF_NAME}"-* ]] || {
              echo "::error::Release asset has no version: $asset"
              exit 1
            }
          done
      - name: Attest release packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "PkgDeck $GITHUB_REF_NAME"
  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
