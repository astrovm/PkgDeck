name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal:
    name: Qt-free terminal (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p pkgdeck-core -p pkd --all-targets -- -D warnings
      - run: cargo test --locked -p pkgdeck-core -p pkd
      - run: |
          cargo build --locked -p pkd
          if cargo tree -p pkd | grep -E 'cxx-qt|qt-build'; then
            echo 'Qt dependency leaked into pkd' >&2
            exit 1
          fi
          if ldd target/debug/pkd | grep -i qt; then
            echo 'pkd links Qt' >&2
            exit 1
          fi

  desktop:
    name: GUI, coverage and packages (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_dir: gcc_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            qt_dir: gcc_arm64
    runs-on: ${{ matrix.runner }}
    env:
      QT_ROOT_DIR: ${{ github.workspace }}/build/Qt/6.8.3/${{ matrix.qt_dir }}
      PKGDECK_SDK_PREFIX: ${{ github.workspace }}/build/kde
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build lld pkg-config libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libvulkan-dev libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 libxcb-image0 libxcb-render-util0 libxcb-randr0 libxcb-sync1 libxcb-xfixes0 libxcb-glx0 libdbus-1-3 libfontconfig1 libfreetype6 libopengl0 libpulse0 libgssapi-krb5-2 libnss3 libasound2t64 libxcomposite1 libxdamage1 libxtst6 libwayland-cursor0 libwayland-egl1 flatpak flatpak-builder snapd squashfs-tools zsync desktop-file-utils
          rustup show
          pip install aqtinstall==3.2.1
      - name: Install pinned Qt and Kirigami
        run: |
          aqt install-qt '${{ matrix.qt_host }}' desktop 6.8.3 '${{ matrix.qt_arch }}' -O build/Qt -m qtshadertools qtimageformats
          export PATH="$QT_ROOT_DIR/bin:$PATH"
          export CMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          scripts/build-kirigami.sh
          echo "$QT_ROOT_DIR/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$PKGDECK_SDK_PREFIX:$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PKGDECK_SDK_PREFIX/lib:$QT_ROOT_DIR/lib" >> "$GITHUB_ENV"
          echo "QML_IMPORT_PATH=$PKGDECK_SDK_PREFIX/qml:$QT_ROOT_DIR/qml" >> "$GITHUB_ENV"
      - name: Lint and test all workspace code
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Enforce 95 percent Rust line coverage
        run: |
          cargo install cargo-llvm-cov --version 0.6.16 --locked
          mkdir -p coverage
          cargo llvm-cov --workspace --include-build-script --locked --fail-under-lines 95 --lcov --output-path coverage/lcov.info
      - name: Build and stage both executables
        run: |
          cargo build --workspace --release --locked
          python3 scripts/bundle.py
          desktop-file-validate assets/io.github.astrovm.PkgDeck.desktop
          unset LD_LIBRARY_PATH QML_IMPORT_PATH
          python3 scripts/smoke.py gui build/AppDir/AppRun
          python3 scripts/smoke.py terminal build/AppDir/AppRun --cli
          build/AppDir/AppRun --cli --version
      - name: Build and smoke-test AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/build/appimagetool
        run: |
          curl -fL --retry 3 'https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage' -o "$APPIMAGETOOL"
          chmod +x "$APPIMAGETOOL"
          scripts/package.sh appimage
          unset LD_LIBRARY_PATH QML_IMPORT_PATH
          export APPIMAGE_EXTRACT_AND_RUN=1
          python3 scripts/smoke.py gui 'build/artifacts/PkgDeck-${{ matrix.arch }}.AppImage'
          python3 scripts/smoke.py terminal 'build/artifacts/PkgDeck-${{ matrix.arch }}.AppImage' --cli
      - name: Build and smoke-test Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.kde.Platform//6.8 org.kde.Sdk//6.8
          scripts/package.sh flatpak
          flatpak install --user -y --noninteractive 'build/artifacts/PkgDeck-${{ matrix.arch }}.flatpak'
          python3 scripts/smoke.py gui flatpak run --env=QT_QPA_PLATFORM=offscreen --env=QT_QUICK_BACKEND=software io.github.astrovm.PkgDeck
          python3 scripts/smoke.py terminal flatpak run --command=pkd io.github.astrovm.PkgDeck
      - name: Build and inspect Snap
        run: |
          scripts/package.sh snap
          unsquashfs -d build/snap-check build/artifacts/*.snap
          test -x build/snap-check/usr/bin/pkgdeck
          test -x build/snap-check/usr/bin/pkd
          unset LD_LIBRARY_PATH QML_IMPORT_PATH
          python3 scripts/smoke.py gui build/snap-check/AppRun
          python3 scripts/smoke.py terminal build/snap-check/usr/bin/pkd
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: build/artifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.arch }}
          path: coverage/lcov.info
          if-no-files-found: error
