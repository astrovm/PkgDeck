name: Publish Flatpak repository
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag (for example v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - name: Trigger astrovm Flatpak repository publication
        env:
          GH_TOKEN: ${{ secrets.FLATPAK_REPO_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::FLATPAK_REPO_TOKEN is required to publish to astrovm/flatpak'
            exit 1
          fi
          tag=${EVENT_TAG:-$INPUT_TAG}
          gh api \
            --method POST \
            repos/astrovm/flatpak/dispatches \
            -f event_type=publish-app \
            -f "client_payload[repository]=$GITHUB_REPOSITORY" \
            -f "client_payload[tag]=$tag"
