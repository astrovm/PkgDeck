name: Publish Flatpak
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  flathub:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
    steps:
      - name: Explain missing publishing credential
        if: env.GH_TOKEN == ''
        run: echo 'Set FLATHUB_TOKEN to submit release manifests to Flathub.'
      - name: Resolve release tag
        if: env.GH_TOKEN != ''
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${EVENT_TAG:-$INPUT_TAG}" >> "$GITHUB_OUTPUT"
      - name: Download immutable release manifest
        if: env.GH_TOKEN != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern io.github.astrovm.PkgDeck.yml --pattern cargo-sources.json
      - name: Open Flathub update
        if: env.GH_TOKEN != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          owner=$(gh api user --jq .login)
          gh repo fork flathub/flathub --clone=false
          git clone "https://x-access-token:${GH_TOKEN}@github.com/$owner/flathub.git" flathub
          cd flathub
          git remote add upstream https://github.com/flathub/flathub.git
          git fetch upstream master
          branch="pkgdeck-${TAG#v}"
          git checkout -B "$branch" upstream/master
          cp ../release/io.github.astrovm.PkgDeck.yml .
          cp ../release/cargo-sources.json .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add io.github.astrovm.PkgDeck.yml cargo-sources.json
          git commit -m "Update io.github.astrovm.PkgDeck to $TAG"
          git push --force origin "$branch"
          gh pr create --repo flathub/flathub --head "$owner:$branch" --base master \
            --title "Update io.github.astrovm.PkgDeck to $TAG" \
            --body "Release manifest generated from the immutable $TAG archive and Cargo lockfile."
