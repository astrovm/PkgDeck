name: Mutants
# Every mutant of the workspace (scripts/mutants.sh), split into 64 parts.
# All of them take days of runner time, so each week runs a quarter of the
# parts and four weeks cover everything. What survives is listed in the
# open "Missed mutants" issue.
on:
  schedule:
    - cron: '0 5 * * 6'
  workflow_dispatch:
    inputs:
      quarter:
        description: Which quarter of the parts to run, 0 to 3 (empty for this week's)
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  plan:
    name: Mutants / Plan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - name: Pick this week's parts
        id: plan
        env:
          QUARTER: ${{ inputs.quarter }}
        run: |
          quarter=${QUARTER:-$(( $(date -u +%s) / 604800 % 4 ))}
          [[ $quarter =~ ^[0-3]$ ]] || { echo "Quarter must be 0 to 3, got $quarter" >&2; exit 1; }
          echo "parts=$(jq -cn --argjson q "$quarter" '[range($q * 16; $q * 16 + 16)]')" >> "$GITHUB_OUTPUT"

  mutants:
    name: Mutants / Part ${{ matrix.part }} of 64
    needs: plan
    # Arm restores Test / Linux (aarch64)'s plain debug builds.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Rust build outputs
        uses: ./.github/actions/rust-cache
        with:
          arch: aarch64
          scope: linux
          save: 'false'
      - name: Set up desktop dependencies
        uses: ./.github/actions/setup-desktop
      - name: Mutate part ${{ matrix.part }}
        # Missed mutants (2) and timeouts (3) are the findings; the report
        # job lists them. Anything else is a broken run.
        run: |
          status=0
          scripts/mutants.sh shard "${{ matrix.part }}/64" || status=$?
          [[ $status == 0 || $status == 2 || $status == 3 ]] || exit "$status"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-part-${{ matrix.part }}
          path: build/mutants/mutants.out
          if-no-files-found: ignore

  report:
    name: Mutants / Report
    needs: [plan, mutants]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-part-*
          path: results
      - name: List what survived in the open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PARTS: ${{ needs.plan.outputs.parts }}
          JOBS: ${{ needs.mutants.result }}
        run: |
          missed=$(cat results/*/missed.txt 2>/dev/null | sort -u || true)
          timeouts=$(cat results/*/timeout.txt 2>/dev/null | sort -u || true)
          parts=$(jq -r 'map(tostring) | join(", ")' <<< "$PARTS")
          issue=$(gh issue list --state open --search 'in:title "Missed mutants"' --json number --jq '.[0].number // empty')
          {
            echo "Parts $parts of 64: [run]($RUN), jobs $JOBS."
            echo
            if [[ -z $missed && -z $timeouts ]]; then
              echo 'Every mutant in these parts was caught.'
            fi
            if [[ -n $missed ]]; then
              echo "### Missed ($(wc -l <<< "$missed"))"
              echo 'No test failed when this code changed:'
              echo '```'
              echo "$missed"
              echo '```'
            fi
            if [[ -n $timeouts ]]; then
              echo "### Timed out ($(wc -l <<< "$timeouts"))"
              echo '```'
              echo "$timeouts"
              echo '```'
            fi
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [[ -n $issue ]]; then
            gh issue comment "$issue" --body-file report.md
          elif [[ -n $missed || -n $timeouts ]]; then
            gh issue create --title 'Missed mutants' --body-file report.md
          fi
