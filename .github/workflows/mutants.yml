name: Mutants
# Mutation testing (scripts/mutants.sh). It never blocks a merge: none of
# this is in CI / Required.
# - A pull request mutates the Rust lines it changed, and one comment lists
#   the changes no test noticed, for a follow-up.
# - Every week, a quarter of all mutants, split into 64 parts, so four weeks
#   cover everything. What survives is listed in the open "Missed mutants"
#   issue.
on:
  pull_request:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/mutants.toml
      - scripts/mutants.sh
      - scripts/mutants-comment.sh
      - scripts/mutants-post.sh
      - scripts/mutants-post.test.sh
      - .github/workflows/mutants.yml
  schedule:
    - cron: '0 5 * * 6'
  workflow_dispatch:
    inputs:
      quarter:
        description: Which quarter of the parts to run, 0 to 3 (empty for this week's)
        required: false

permissions:
  contents: read

concurrency:
  # A newer push replaces a pull request's run; full runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  changed:
    name: Mutants / Changed code
    if: github.event_name == 'pull_request'
    # Arm restores Test / Linux (aarch64)'s plain debug builds.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base branch.
          fetch-depth: 2
      - name: Cache Rust build outputs
        uses: ./.github/actions/rust-cache
        with:
          arch: aarch64
          scope: linux
          save: 'false'
      - name: Set up desktop dependencies
        uses: ./.github/actions/setup-desktop
      - name: Mutate the changed code
        # Missed mutants (2) and timeouts (3) are findings for the comment.
        # Anything else is a broken run.
        run: |
          status=0
          scripts/mutants.sh diff HEAD^1 || status=$?
          [[ $status == 0 || $status == 2 || $status == 3 ]] || exit "$status"
      - name: Comment what lived
        # A fork's token can't comment; its run page has the summary.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/mutants-comment.sh build/mutants/mutants.out
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-changed-code
          path: build/mutants/mutants.out
          if-no-files-found: ignore

  plan:
    name: Mutants / Plan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - name: Check out source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # A week runs its quarter. A pull request that changes this setup
      # runs part 0 for real, so a broken setup shows before Saturday; its
      # findings aren't the pull request's, so they go in no comment.
      - name: Pick the parts
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          QUARTER: ${{ inputs.quarter }}
        run: |
          if [[ $EVENT == pull_request ]]; then
            if git diff --quiet HEAD^1 -- .cargo/mutants.toml scripts/mutants.sh scripts/mutants-comment.sh scripts/mutants-post.sh scripts/mutants-post.test.sh .github/workflows/mutants.yml; then
              echo "The setup didn't change."
            else
              echo 'parts=[0]' >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          quarter=${QUARTER:-$(( $(date -u +%s) / 604800 % 4 ))}
          [[ $quarter =~ ^[0-3]$ ]] || { echo "Quarter must be 0 to 3, got $quarter" >&2; exit 1; }
          echo "parts=$(jq -cn --argjson q "$quarter" '[range($q * 16; $q * 16 + 16)]')" >> "$GITHUB_OUTPUT"

  mutants:
    name: Mutants / Part ${{ matrix.part }} of 64
    needs: plan
    if: needs.plan.outputs.parts != ''
    # Arm restores Test / Linux (aarch64)'s plain debug builds.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Rust build outputs
        uses: ./.github/actions/rust-cache
        with:
          arch: aarch64
          scope: linux
          save: 'false'
      - name: Set up desktop dependencies
        uses: ./.github/actions/setup-desktop
      - name: Mutate part ${{ matrix.part }}
        # Missed mutants (2) and timeouts (3) are the findings; the report
        # job lists them. Anything else is a broken run.
        run: |
          status=0
          scripts/mutants.sh shard "${{ matrix.part }}/64" || status=$?
          [[ $status == 0 || $status == 2 || $status == 3 ]] || exit "$status"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-part-${{ matrix.part }}
          path: build/mutants/mutants.out
          if-no-files-found: ignore

  report:
    name: Mutants / Report
    needs: [plan, mutants]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.plan.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the report poster
        run: bash scripts/mutants-post.test.sh
      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-part-*
          path: results
      - name: List what survived in the open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PARTS: ${{ needs.plan.outputs.parts }}
          JOBS: ${{ needs.mutants.result }}
        run: |
          missed=$(cat results/*/missed.txt 2>/dev/null | sort -u || true)
          timeouts=$(cat results/*/timeout.txt 2>/dev/null | sort -u || true)
          parts=$(jq -r 'map(tostring) | join(", ")' <<< "$PARTS")
          # A part that died (a lost runner, a cancelled job) uploads nothing.
          lost=$(jq -r '.[]' <<< "$PARTS" | while read -r part; do
            [[ -d results/mutants-part-$part ]] || printf '%s, ' "$part"
          done)
          lost=${lost%, }
          {
            echo "Parts $parts of 64: [run]($RUN), jobs $JOBS."
            echo
            if [[ -n $lost ]]; then
              echo "**No results from part $lost:** its job failed, so its mutants are not in this list. See the run."
              echo
            fi
            if [[ -z $missed && -z $timeouts && -z $lost ]]; then
              echo 'Every mutant in these parts was caught.'
            fi
            if [[ -n $missed ]]; then
              echo "### Missed ($(wc -l <<< "$missed"))"
              echo 'No test failed when this code changed:'
              echo '```'
              echo "$missed"
              echo '```'
            fi
            if [[ -n $timeouts ]]; then
              echo "### Timed out ($(wc -l <<< "$timeouts"))"
              echo '```'
              echo "$timeouts"
              echo '```'
            fi
          } > report.md
          # A step summary is limited to 1 MiB; the issue gets the whole report.
          if (( $(wc -c < report.md) > 1000000 )); then
            head -c 1000000 report.md | sed '$d' > summary.md
            # Close a code fence the cut left open.
            if (( $(grep -c '^```$' summary.md) % 2 )); then echo '```' >> summary.md; fi
            echo "Cut at 1 MB. The whole report is in the issue and in the part artifacts of [the run]($RUN)." >> summary.md
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          has_findings=false
          if [[ -n $missed || -n $timeouts || -n $lost ]]; then has_findings=true; fi
          scripts/mutants-post.sh report.md "$has_findings"
