name: VM cache
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare host VM (x86_64)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check prepared VM cache
        id: vm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: true
          path: |
            build/host-vm/base.img
            build/host-vm/prepared-*.qcow2
            build/host-vm/prepared-*.sha256
          key: pkgdeck-host-vm-v2-ubuntu-26.04-${{ hashFiles('scripts/vm/prepare.sh', 'scripts/test-host-vm.sh') }}
      - name: Install VM dependencies
        if: steps.vm-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
      - name: Prepare verified VM image
        if: steps.vm-cache.outputs.cache-hit != 'true'
        run: scripts/test-host-vm.sh --prepare-only
      - name: Save prepared VM cache
        if: steps.vm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/host-vm/base.img
            build/host-vm/prepared-*.qcow2
            build/host-vm/prepared-*.sha256
          key: ${{ steps.vm-cache.outputs.cache-primary-key }}
      - name: Upload preparation logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-vm-prepare
          path: build/host-vm/logs
          if-no-files-found: ignore
