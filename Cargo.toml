[workspace]
members = ["crates/pkgdeck-core", "crates/pkd", "crates/pkgdeck", "crates/pkgdeck-tools"]
default-members = ["crates/pkgdeck-core", "crates/pkd"]
resolver = "2"

[workspace.package]
version = "0.1.5"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/astrovm/PkgDeck"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
hex = "=0.4.3"
signal-hook = "=0.4.4"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
pkgdeck-core = { path = "crates/pkgdeck-core" }
clap = { version = "=4.6.7", features = ["derive"] }
unicode-width = "=0.2.2"
cxx = "=1.0.202"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
cxx-qt-build = "=0.10.0"
# Keep the CXX runtime and code generator on the same ABI revision.
cxx-gen = "=0.7.202"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
