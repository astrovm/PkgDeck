[workspace]
members = ["crates/pkgdeck-core", "crates/pkd", "crates/pkgdeck", "crates/pkgdeck-tools", "crates/pkgdeck-app"]
default-members = ["crates/pkgdeck-core", "crates/pkd"]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/astrovm/PkgDeck"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
hex = "=0.4.3"
signal-hook = "=0.4.4"
rustix = { version = "=1.1.5", features = ["fs", "process", "event", "system"] }
pkgdeck-core = { path = "crates/pkgdeck-core" }
clap = { version = "=4.6.7", features = ["derive"] }
clap_complete = "=4.6.11"
unicode-width = "=0.2.2"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

# Debug builds keep our code easy to step through, but egui and image
# decoding are too slow unoptimized: the window took ~600 ms to open and
# burned CPU while idle.
[profile.dev.package."*"]
opt-level = 2
