[workspace]
members = ["crates/pkgdeck-core", "crates/pkd", "crates/pkgdeck"]
default-members = ["crates/pkgdeck-core", "crates/pkd"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/astrovm/PkgDeck"

[workspace.dependencies]
pkgdeck-core = { path = "crates/pkgdeck-core" }
clap = { version = "=4.5.37", features = ["derive"] }
crossterm = "=0.28.1"
ratatui = "=0.29.0"
cxx = "=1.0.194"
cxx-qt = "=0.8.1"
cxx-qt-lib = { version = "=0.8.1", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
cxx-qt-build = "=0.8.1"
# CXX-Qt 0.8 permits newer generators whose ABI no longer matches CXX 1.0.194.
cxx-gen = "=0.7.194"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
