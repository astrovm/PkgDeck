[package]
name = "pkgdeck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PkgDeck's window: browse, install, remove and update packages from every source"
publish = false

[dependencies]
pkgdeck-core.workspace = true
pkgdeck-app = { path = "../pkgdeck-app" }
serde.workspace = true
serde_json.workspace = true
rustix.workspace = true
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "=0.37.0", default-features = false, features = ["file", "image", "svg"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
sha2.workspace = true
hex.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
rfd = "=0.17.2"
memmap2 = "=0.9.12"
# The window's handle, to ask the desktop to blur behind glass styles.
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.7", default-features = false, features = ["async-io", "blocking"] }
notify-rust = "=4.18.2"
# Reads the desktop's reduce-motion setting through its settings portal.
zbus = { version = "=6.2.0", default-features = false, features = ["default-rt"] }
# Asks KWin on X11 to blur behind glass styles; winit only does it on Wayland.
x11rb = { version = "=0.14.0", default-features = false }

[build-dependencies]
cc = "=1.10.0"

[dev-dependencies]
egui_kittest = { version = "=0.37.0", features = ["wgpu", "snapshot"] }

[lints]
workspace = true
