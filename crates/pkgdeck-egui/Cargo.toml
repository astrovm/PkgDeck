[package]
name = "pkgdeck-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PkgDeck's Installed page in egui: a trial of a Qt-free GUI"
publish = false

[dependencies]
pkgdeck-core.workspace = true
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = { version = "=0.36.2", default-features = false, features = ["file", "image", "svg"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
egui_kittest = "=0.36.2"

[lints]
workspace = true
