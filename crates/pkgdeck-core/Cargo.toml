[package]
name = "pkgdeck-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pkgdeck-host-runner"
path = "src/bin/host-runner.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
semver = "=1.0.28"
sha2.workspace = true
hex.workspace = true
base64.workspace = true
rustix.workspace = true
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }
# Local time for Trash records.
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }

# Reads AppImage contents (name, icon, version) without running them.
[target.'cfg(target_os = "linux")'.dependencies]
backhand = { version = "=0.25.5", default-features = false, features = ["gzip", "xz", "zstd", "lz4"] }
dwarfs = { version = "=0.2.1", default-features = false, features = ["zstd", "lzma"] }
positioned-io = { version = "=0.3.5", default-features = false }
# Runs host commands from the Flatpak over one shared session-bus connection.
zbus = { version = "=6.2.1", default-features = false, features = ["default-rt"] }
futures-lite = "=2.6.1"

[features]
# Exposes [`test_support`] so other crates' tests, and this crate's
# integration tests, can write executables. Unit tests see it through
# `cfg(test)` either way. Empty: it only compiles that module.
test-support = []

[target.'cfg(target_os = "linux")'.dev-dependencies]
# A fake Flatpak portal on a private connection.
zbus = { version = "=6.2.1", default-features = false, features = ["default-rt", "p2p"] }

[dev-dependencies]
# Depends back on this package with `test-support`, so feature unification
# turns the module on while integration tests build. A dev-dependency cycle
# is allowed; production builds never follow it.
pkgdeck-core-test-support = { path = "test-support" }

[lints]
workspace = true
