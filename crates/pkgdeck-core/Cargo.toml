[package]
name = "pkgdeck-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pkgdeck-host-runner"
path = "src/bin/host-runner.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
semver = "=1.0.28"
sha2.workspace = true
hex.workspace = true
rustix.workspace = true
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }

# Reads AppImage contents (name, icon, version) without running them.
[target.'cfg(target_os = "linux")'.dependencies]
backhand = { version = "=0.25.5", default-features = false, features = ["gzip", "xz", "zstd", "lz4"] }
dwarfs = { version = "=0.2.1", default-features = false, features = ["zstd", "lzma"] }
positioned-io = { version = "=0.3.5", default-features = false }
# Runs host commands from the Flatpak over one shared session-bus connection.
zbus = { version = "=6.0.0", default-features = false, features = ["default-rt"] }
futures-lite = "=2.6.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# A fake Flatpak portal on a private connection.
zbus = { version = "=6.0.0", default-features = false, features = ["default-rt", "p2p"] }

[lints]
workspace = true
