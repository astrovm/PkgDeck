[package]
name = "pkgdeck-core-test-support"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Enables pkgdeck-core's test-support feature for its own tests"

[dependencies]
pkgdeck-core = { path = "..", features = ["test-support"] }

[lib]
path = "lib.rs"
test = false
doctest = false
