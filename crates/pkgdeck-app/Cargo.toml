[package]
name = "pkgdeck-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PkgDeck's window logic without a toolkit: what to load, show, review and run"
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
rustix.workspace = true
pkgdeck-core.workspace = true
roxmltree = { version = "0.21", default-features = false }
serde_yaml = { version = "0.9", default-features = false }
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }

[lints]
workspace = true

[dev-dependencies.pkgdeck-tools]
path = "../pkgdeck-tools"
